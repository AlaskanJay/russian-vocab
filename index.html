<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Russian Matching Game</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:36px;
}

.instructions{
    text-align:center;
    font-size:20px;
    margin-bottom:25px;
    color:#555;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.card{
    background:white;
    border:4px solid #dddddd;
    border-radius:25px;

    min-height:95px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:38px;
    font-weight:500;

    cursor:pointer;

    transition:.15s;
}

.card:hover{
    transform:scale(1.02);
}

.selected{
    border-color:#4caf50;
    background:#e8f5e9;
}

.matched{
    background:#c8f0cf;
    border-color:#4caf50;
}

#status{
    text-align:center;
    font-size:28px;
    margin-top:30px;
    font-weight:bold;
}

#nextButton{
    display:none;

    margin:30px auto;

    width:100%;
    max-width:450px;

    padding:22px;

    border:none;
    border-radius:30px;

    background:#f7c948;

    font-size:28px;
    font-weight:bold;

    cursor:pointer;
}

@media(max-width:700px){

    h1{
        font-size:28px;
    }

    .card{
        font-size:28px;
        min-height:85px;
    }

    #status{
        font-size:22px;
    }
}

</style>
</head>

<body>

<h1>Russian Matching Game</h1>

<div class="instructions">
Tap a Russian word to hear it.
</div>

<div class="container">
    <div id="ru"></div>
    <div id="en"></div>
</div>

<div id="status"></div>

<button id="nextButton">
NEXT LESSON →
</button>

<script>

const pairs = [

["парк","park"],
["три","three"],
["кровать","bed"],
["преподаватель","teacher"],
["дом","house"],
["кошка","cat"]

];

let selected = null;
let matched = 0;

function shuffle(array){

    return [...array]
    .sort(() => Math.random() - 0.5);

}

function speak(word){

    const msg =
    new SpeechSynthesisUtterance(word);

    msg.lang = "ru-RU";

    speechSynthesis.speak(msg);

}

function clickCard(el,id){

    if(el.classList.contains("matched"))
        return;

    if(!selected){

        selected = {el,id};

        el.classList.add("selected");

        return;

    }

    if(selected.id === id &&
       selected.el !== el){

        selected.el.classList.remove("selected");

        selected.el.classList.add("matched");
        el.classList.add("matched");

        matched++;

        document.getElementById("status")
        .innerText = "✅ Correct!";

        if(matched === pairs.length){

            document.getElementById("status")
            .innerText =
            "🎉 You matched all words!";

            document.getElementById("nextButton")
            .style.display = "block";
        }

    }else{

        selected.el.classList.remove("selected");

        document.getElementById("status")
        .innerText =
        "❌ Try again";

    }

    selected = null;
}

function createRussian(item){

    const div =
    document.createElement("div");

    div.className = "card";

    div.textContent =
    item.text;

    div.onclick = () => {

        speak(item.text);

        clickCard(div,item.id);
    };

    document.getElementById("ru")
    .appendChild(div);
}

function createEnglish(item){

    const div =
    document.createElement("div");

    div.className = "card";

    div.textContent =
    item.text;

    div.onclick = () => {

        clickCard(div,item.id);
    };

    document.getElementById("en")
    .appendChild(div);
}

const russian =
shuffle(
pairs.map((p,i)=>({
id:i,
text:p[0]
}))
);

const english =
shuffle(
pairs.map((p,i)=>({
id:i,
text:p[1]
}))
);

russian.forEach(createRussian);
english.forEach(createEnglish);

document
.getElementById("nextButton")
.onclick = () => {

    alert(
      "Future Lesson 2 goes here!"
    );

};

</script>

</body>
</html>
